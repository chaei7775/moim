<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>걱정냠냠 · 오늘의 걱정운세</title>
<meta name="description" content="걱정은 내가 먹을게. 행운은 네가 가져!">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F8F5FC; --main:#B99BD8; --main-d:#9C7BC0; --sub:#F5C6D8; --luck:#FFE39B;
  --ink:#34313B; --muted:#85818E; --line:#EDE7F4;
  --head:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:20px; --shadow:0 4px 16px rgba(120,90,160,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{font-family:var(--body); color:var(--ink); background:#F4F1F8; word-break:keep-all}
button{font:inherit; color:inherit}
.app{position:relative; max-width:430px; height:100%; min-height:100vh; margin:0 auto; background:var(--bg); display:flex; flex-direction:column; overflow:hidden}
@media (min-width:431px){.app{box-shadow:0 0 40px rgba(120,90,160,.12)}}
header{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 20px 6px; min-height:56px}
.logo{font-family:var(--head); font-size:22px; color:var(--main-d); display:flex; align-items:center; gap:6px}
.logo i{font-style:normal; color:#E9B94A; font-size:18px}
.back{width:44px; height:44px; margin-left:-12px; border:0; background:none; font-size:22px; color:var(--muted); cursor:pointer}
main{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:0 20px 20px; -webkit-overflow-scrolling:touch}
.view{animation:in .25s ease-out}
@keyframes in{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.stage{position:relative; width:100%; height:290px; margin:6px auto 0}
.bob{position:absolute; left:0; right:0; bottom:8px; height:250px; transform-origin:50% 100%; animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.985)}}
.pose{position:absolute; left:50%; bottom:0; transform:translateX(-50%); opacity:0; transition:opacity .2s; pointer-events:none; user-select:none}
.pose.on{opacity:1}
.p-idle{width:268px}.p-eat{width:270px}.p-luck{width:318px}
.shadow{position:absolute; left:50%; bottom:2px; width:200px; height:18px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(ellipse,rgba(120,90,160,.18),rgba(120,90,160,0) 70%)}
.rep{position:absolute; right:8px; bottom:12px; width:62px; height:auto; animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
h1{font-family:var(--head); font-weight:400; font-size:26px; line-height:1.3; text-align:center; margin:18px 0 6px}
.sub{margin:0; text-align:center; color:var(--muted); font-size:16.5px; line-height:1.6}
.btn{display:flex; align-items:center; justify-content:center; width:100%; min-height:54px; border:0; border-radius:18px; margin-top:20px; font-family:var(--head); font-size:20px; color:#fff; background:var(--main); box-shadow:var(--shadow); cursor:pointer; transition:transform .1s, background .15s}
.btn:active{transform:scale(.985); background:var(--main-d)}
.btn.ghost{background:var(--bg2); color:var(--main-d); box-shadow:none; margin-top:10px}
.btn[disabled]{background:#E4DCEE; color:#fff; box-shadow:none; cursor:default}
.hint{margin:10px 0 0; text-align:center; font-size:14px; color:var(--muted)}
.ttl{font-family:var(--head); font-weight:400; font-size:24px; margin:6px 0 14px; line-height:1.35}
.cats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cat{display:flex; align-items:center; gap:10px; min-height:60px; padding:10px 14px; border:1.5px solid transparent; border-radius:var(--r); background:var(--bg2); font-size:17px; text-align:left; cursor:pointer}
.cat span.ic{font-size:22px; width:28px; text-align:center}
.cat[aria-pressed=true]{background:#EFE6F8; border-color:var(--main)}
.lbl{display:block; margin:18px 0 8px; font-size:15.5px; color:var(--muted)}
.ta{width:100%; min-height:92px; border:1.5px solid var(--line); border-radius:var(--r); background:#fff; padding:12px 14px; font:inherit; font-size:16px; color:var(--ink); resize:none; outline:none}
.ta:focus{border-color:var(--main)}
.cnt{margin-top:4px; text-align:right; font-size:13px; color:var(--muted)}
.cnt.warn{color:#C0577E}
.emos{display:flex; gap:8px; flex-wrap:wrap}
.emo{flex:1 1 auto; min-height:46px; padding:8px 12px; border:1.5px solid transparent; border-radius:999px; background:var(--bg2); font-size:16px; cursor:pointer; white-space:nowrap}
.emo[aria-pressed=true]{background:#EFE6F8; border-color:var(--main); color:var(--main-d)}
.anim{position:absolute; inset:0; background:#fff; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center}
.anim .stage{height:340px; max-width:340px}
.cloud{position:absolute; left:-4px; top:50px; width:96px; opacity:0; transform:scale(.5); transition:transform .8s cubic-bezier(.4,0,.2,1), opacity .5s}
.cloud.show{opacity:1; transform:scale(1) translateY(-6px)}
.cloud.go{opacity:1; transform:translate(130px,118px) scale(.5)}
.cloud.gone{opacity:0; transform:translate(140px,128px) scale(.05); transition-duration:.6s}
.anim .msg{height:28px; margin-top:6px; font-family:var(--head); font-size:20px; color:var(--main-d)}
.skip{position:absolute; right:14px; bottom:calc(18px + env(safe-area-inset-bottom)); min-width:44px; min-height:44px; padding:0 14px; border:0; background:none; color:var(--muted); font-size:15px; cursor:pointer}
.spark{position:absolute; left:50%; top:44%; pointer-events:none}
.spark span{position:absolute; left:0; top:0; color:#E9B94A; font-size:18px; animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.3); opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1); opacity:0}}
.card{background:var(--bg2); border-radius:var(--r); padding:18px 18px 16px; margin-bottom:12px}
.card small{display:block; font-size:13.5px; color:var(--main-d); margin-bottom:6px}
.card p{margin:0; font-size:17px; line-height:1.65}
.card.act{background:#FFF8E1}
.card.act small{color:#A47F1C}
.res-h{font-family:var(--head); font-size:24px; text-align:center; margin:6px 0 14px}
.gift{display:flex; flex-direction:column; align-items:center; padding-top:10px}
.gift .mimg{height:190px; width:auto; animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg); opacity:0}100%{transform:none; opacity:1}}
.gift .mname{font-family:var(--head); font-size:28px; margin-top:12px}
.gift .mmean{color:var(--muted); font-size:17px; margin-top:2px}
.tag{display:inline-block; background:var(--luck); color:#7A5B00; border-radius:999px; padding:4px 12px; font-size:13.5px; margin-top:10px}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px}
.mc{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; aspect-ratio:1/1.12; border:0; border-radius:var(--r); background:var(--bg2); cursor:pointer; padding:8px}
.mc img{max-width:78%; max-height:62%; height:auto; width:auto}
.mc.lock img{filter:brightness(0) opacity(.14)}
.mc span{margin-top:6px; font-size:14.5px; color:var(--ink)}
.mc.lock span{color:#B9B3C4}
.mc .star{position:absolute; top:6px; right:8px; color:#E9B94A; font-size:15px}
.cnt2{text-align:center; color:var(--muted); font-size:15px; margin:2px 0 0}
.sheet-bg{position:absolute; inset:0; background:rgba(52,49,59,.35); z-index:8; display:flex; align-items:flex-end; animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%; background:#fff; border-radius:24px 24px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); text-align:center; animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet img{height:130px; width:auto}
.sheet.lockimg img{filter:brightness(0) opacity(.14)}
.sheet .n{font-family:var(--head); font-size:26px; margin-top:8px}
.sheet .m{color:var(--muted); font-size:16.5px; margin-top:2px}
.tabs{flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); background:#fff; padding-bottom:env(safe-area-inset-bottom)}
.tab{min-height:58px; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:13.5px; color:#A59FB1; cursor:pointer}
.tab b{font-size:20px; font-weight:400}
.tab[aria-selected=true]{color:var(--main-d)}
.care{background:#FFF4F6; border-radius:var(--r); padding:16px; line-height:1.7; font-size:16.5px; color:#7A4A58; margin-top:8px}
.toast{position:absolute; left:50%; bottom:84px; transform:translateX(-50%); background:#34313B; color:#fff; padding:10px 16px; border-radius:14px; font-size:14.5px; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; max-width:86%; text-align:center}
.toast.on{opacity:1}
.note{margin:14px 0 0; text-align:center; font-size:12.5px; color:#A59FB1; line-height:1.6}
.trio{display:flex; justify-content:center; gap:12px; margin:10px 0 18px; perspective:900px}
.tcard{width:100px; height:156px; padding:0; border:0; background:none; cursor:pointer; transition:opacity .3s}
.tcard .in{position:relative; display:block; width:100%; height:100%; transform-style:preserve-3d; transition:transform .6s}
.tcard.flip .in{transform:rotateY(180deg)}
.tcard.dim{opacity:.25}
.tcard .cb,.tcard .front{margin:0;position:absolute; inset:0; display:block; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:14px; overflow:hidden}
.tcard .cb{display:flex; align-items:center; justify-content:center; background-color:#B99BD8; background-image:radial-gradient(rgba(255,255,255,.4) 1.5px,transparent 2px); background-size:14px 14px; border:2px solid #9C7BC0}
.tcard .cb b{color:#fff; font-size:34px; font-weight:400}
.tcard .front{transform:rotateY(180deg)}
.tface{display:flex; flex-direction:column; align-items:center; justify-content:space-between; width:100%; height:100%; padding:10px 6px; background:#FBF8FF; border:2px solid var(--main); border-radius:14px; text-align:center}
.tface i{font-style:normal; font-family:var(--head); font-size:15px; color:var(--main-d)}
.tface b{font-weight:400; font-size:42px; color:#E9B94A; line-height:1}
.tface em{font-style:normal; font-family:var(--head); font-size:16px; color:var(--ink)}
.tbig{width:92px; height:144px; flex:0 0 auto}
.tbig.sm{width:70px; height:110px}
.tbig.sm .tface b{font-size:30px}.tbig.sm .tface em{font-size:13.5px}.tbig.sm .tface i{font-size:12px}
.dollS{width:170px; height:auto; margin-top:6px}
.guess{display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:8px}
.gname{font-family:var(--head); font-size:22px}.gname b{font-weight:400; color:var(--main-d)}
.bub{display:flex; align-items:center; gap:8px; width:100%}
.bub img{width:96px; height:auto; flex:0 0 auto}
.bub p{margin:0; flex:1; background:var(--bg2); border-radius:18px 18px 18px 4px; padding:14px 16px; font-size:17px; line-height:1.55}
.trio3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}
.ans{min-height:54px; border:1.5px solid transparent; border-radius:16px; background:var(--bg2); font-family:var(--head); font-size:18px; cursor:pointer}
.ans:first-child{background:var(--main); color:#fff}
.emos.col{flex-direction:column; margin-top:18px}.emos.col .emo{min-height:54px; font-size:18px}
.tr{display:flex; gap:14px; align-items:center; background:#F1EAFA; border-radius:var(--r); padding:14px; margin-bottom:12px}
.tr small{display:block; font-size:13.5px; color:var(--main-d)}.tr b{font-family:var(--head); font-weight:400; font-size:21px}.tr p{margin:2px 0 0; font-size:15.5px; line-height:1.5; color:var(--muted)}
.chip{display:block; min-height:44px; margin:6px auto 0; border:0; background:none; color:var(--main-d); font-size:14.5px; text-decoration:underline; cursor:pointer}
.date{width:100%; min-height:50px; margin-top:14px; border:1.5px solid var(--line); border-radius:14px; padding:0 12px; font:inherit; font-size:17px}
.sheet .m{line-height:1.55}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media (max-height:700px){.stage{height:240px}.bob{height:204px}.p-idle{width:224px}.p-eat{width:226px}.p-luck{width:266px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header id="hd"></header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="메뉴">
    <button class="tab" id="t-main" type="button"><b>✦</b>걱정냠냠</button>
    <button class="tab" id="t-box" type="button"><b>♡</b>나의 행운함</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>

function decideMascot(){
  var t=todayStr();
  if(store.lastDate===t&&store.todayId&&mById(store.todayId)) return {m:mById(store.todayId),fresh:store.got.indexOf(store.todayId)<0,again:true};
  var notOwned=MASCOTS.filter(function(m){return store.got.indexOf(m.id)<0}), pick, fresh;
  if(notOwned.length){ pick=notOwned[ri(notOwned.length)]; fresh=true }
  else { pick=MASCOTS[ri(MASCOTS.length)]; fresh=false }
  store.lastDate=t; store.todayId=pick.id; persist();
  return {m:pick,fresh:fresh,again:false};
}

  go('<div class="res-h" style="margin-bottom:4px">나의 행운함</div><p class="cnt2">'+n+' / '+MASCOTS.length+'</p>'

      }).join('')+'</div>'
    +(n===0?'<p class="note">걱정을 먹이면 행운 친구가 찾아와요.<br>하루에 한 친구가 새로 와요.</p>':'<p class="note">하루에 한 친구가 새로 와요.</p>'));
  document.querySelector('.grid').addEventListener('click',function(e){ var b=e.target.closest('.mc'); if(b) sheet(b.getAttribute('data-id')) });
}
function sheet(id){
  var m=mById(id), has=store.got.indexOf(id)>=0, isRep=store.rep===id;
  var bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML='<div class="sheet'+(has?'':' lockimg')+'" role="dialog" aria-label="'+(has?m.name:'아직 만나지 못한 친구')+'"><img alt="'+(has?m.name:'실루엣')+'" src="'+IMG[id]+'"><div class="n">'+(has?m.name:'？？？')+'</div><div class="m">'+(has?m.sym+' · '+m.mean:'아직 만나지 못한 친구예요')+'</div>'
    +(has?'<button class="btn" id="rp" type="button">'+(isRep?'대표 행운 친구 해제':'대표 행운 친구로 설정')+'</button>':'')
    +'<button class="btn ghost" id="cl2" type="button">닫기</button></div>';
  app.appendChild(bg);

}

/* ---------- 결과 카드 PNG (9:16) ---------- */
function img(src){ return new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i)}; i.onerror=rej; i.src=src }) }
function wrap(c,t,w){ var out=[],cur=''; for(var i=0;i<t.length;i++){ var n=cur+t[i]; if(c.measureText(n).width>w&&cur){ out.push(cur); cur=t[i]===' '?'':t[i] } else cur=n } if(cur) out.push(cur); return out }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath() }
function star(c,x,y,R,col){ c.fillStyle=col; c.beginPath(); for(var i=0;i<10;i++){ var r=i%2?R*.45:R, a=-Math.PI/2+i*Math.PI/5; c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r) } c.closePath(); c.fill() }
function moon(c,x,y,R,col){ c.fillStyle=col; c.beginPath(); c.arc(x,y,R,0,Math.PI*2); c.fill(); c.fillStyle='#FFFFFF'; c.beginPath(); c.arc(x+R*.45,y-R*.2,R*.85,0,Math.PI*2); c.fill() }
function makeCard(){
  var m=S.mascot||MASCOTS[0], f=S.fortune||{flow:'오늘은 걱정을 내려놓아도 괜찮은 날이야.'}, tc=S.card;
  var HF="'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif", BF="'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  var loads=[]; try{ loads=[document.fonts.load('40px Jua','가나다'),document.fonts.load('30px "Gowun Dodum"','가나다')] }catch(e){}
  return Promise.all(loads.map(function(p){return p.catch(function(){})})).then(function(){return img(IMG[m.id])}).then(function(im){
    var W=1080,H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H; var c=cv.getContext('2d');
    c.fillStyle='#F8F5FC'; c.fillRect(0,0,W,H);
    rr(c,70,230,W-140,1440,60); c.fillStyle='#FFFFFF'; c.fill();
    c.textAlign='center'; c.textBaseline='alphabetic';
    c.fillStyle='#9C7BC0'; c.font='84px '+HF; c.fillText('걱정냠냠',W/2,170);
    star(c,W/2+212,118,22,'#F2C14E'); star(c,W/2-232,138,14,'#F5C6D8');
    var iw=520, ih=iw*im.height/im.width; if(ih>520){ ih=520; iw=ih*im.width/im.height }
    c.drawImage(im,(W-iw)/2,330+(520-ih)/2,iw,ih);
    star(c,230,390,26,'#F2C14E'); star(c,860,470,18,'#F5C6D8'); moon(c,880,330,34,'#F2C14E'); star(c,190,700,14,'#F5C6D8');
    c.fillStyle='#34313B'; c.font='60px '+HF; c.fillText(m.name,W/2,930);
    c.fillStyle='#85818E'; c.font='38px '+BF; c.fillText(m.sym+' · '+m.mean,W/2,985);
    if(tc){ c.fillStyle='#9C7BC0'; c.font='36px '+HF; c.fillText('오늘의 카드 · '+tc.n,W/2,1050) }
    c.fillStyle='#34313B'; c.font='48px '+BF; var y=1130;
    wrap(c,f.flow,W-240).slice(0,3).forEach(function(l){ c.fillText(l,W/2,y); y+=66 });
    c.fillStyle='#85818E'; c.font='36px '+BF; y+=8;
    if(f.comfort) wrap(c,f.comfort,W-260).slice(0,3).forEach(function(l){ c.fillText(l,W/2,y); y+=54 });
    if(f.action){ rr(c,130,1490,W-260,150,36); c.fillStyle='#FFF8E1'; c.fill(); c.fillStyle='#A47F1C'; c.font='30px '+BF; c.fillText('작은 행운 행동',W/2,1534); c.fillStyle='#34313B'; c.font='36px '+BF; var yy=1584; wrap(c,f.action,W-330).slice(0,2).forEach(function(l){ c.fillText(l,W/2,yy); yy+=44 }) }
    c.fillStyle='#9C7BC0'; c.font='42px '+HF; c.fillText('걱정은 내가 먹을게. 행운은 네가 가져!',W/2,1740);
    c.fillStyle='#B8B1C4'; c.font='30px '+BF; c.fillText('재미로 보는 위로예요',W/2,1810);
    return cv;
  });
}
function saveCard(share){
  toast('카드를 만드는 중이에요');
  makeCard().then(function(cv){
    cv.toBlob(function(blob){
      if(!blob){ toast('카드를 만들지 못했어요'); return }
      var name='걱정냠냠-행운카드.png';
      if(share&&navigator.canShare){ try{ var f=new File([blob],name,{type:'image/png'}); if(navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'걱정냠냠',text:'걱정은 내가 먹을게. 행운은 네가 가져!'}).catch(function(){}); return } }catch(e){} }
      if(share&&navigator.share){ navigator.share({title:'걱정냠냠',text:'걱정은 내가 먹을게. 행운은 네가 가져!',url:location.href.split('?')[0]}).catch(function(){}); return }
      var url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url)},4000);
      toast('저장했어요. 안 보이면 다운로드 폴더를 확인해봐');
    },'image/png');
  }).catch(function(){ toast('카드를 만들지 못했어요') });
}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>걱정인형 · 걱정 먹는 인형</title>
<meta name="description" content="걱정이 생기면 인형에게 주세요. 대신 먹고 풀릴 기운을 알려줘요">
<meta name="theme-color" content="#F1E8FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#F4ECFB; --bg2:#FDF1F4; --ink:#4A3A5C; --muted:#8A7B9C;
  --lav:#B792D6; --lav-d:#8F6BB5; --lav-soft:#EFE5F8; --pink:#F7B6C6; --cream:#FFFAF2; --gold:#F6D77A; --line:#E6DAF0;
  --head:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{font-family:var(--body); color:var(--ink); background:linear-gradient(180deg,var(--bg1),var(--bg2)); min-height:100vh; overflow-x:hidden; word-break:keep-all}
.sky{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.sky i{position:absolute; color:#fff; opacity:.0; animation:tw 4s ease-in-out infinite; text-shadow:0 0 6px rgba(183,146,214,.6)}
@keyframes tw{0%,100%{opacity:.0; transform:scale(.6)}50%{opacity:.9; transform:scale(1)}}
.app{position:relative; z-index:1; max-width:480px; margin:0 auto; padding:14px 18px calc(28px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; min-height:100vh}
header{display:flex; justify-content:space-between; align-items:center; height:44px}
.brand{font-family:var(--head); font-size:21px; color:var(--lav-d); display:flex; align-items:center; gap:6px}
.brand b{font-weight:400; color:var(--gold); text-shadow:0 1px 0 #E5BE55}
#snd{border:0; background:#fff; width:40px; height:40px; border-radius:50%; font-size:18px; box-shadow:0 2px 8px rgba(143,107,181,.18); cursor:pointer}
.stage{position:relative; height:340px; margin-top:8px}
.glow{position:absolute; left:50%; bottom:6px; width:300px; height:300px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 68%)}
.shadow{position:absolute; left:50%; bottom:8px; width:210px; height:22px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(ellipse,rgba(120,80,150,.22),rgba(120,80,150,0) 70%)}
.bob{position:absolute; left:0; right:0; bottom:20px; height:290px; transform-origin:50% 100%; animation:breathe 3.4s ease-in-out infinite}
.pose{position:absolute; left:50%; bottom:0; transform:translateX(-50%); opacity:0; transition:opacity .22s; height:auto; pointer-events:none; user-select:none}
.pose.on{opacity:1}
#p-idle{width:268px}#p-eat{width:270px}#p-luck{width:318px}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.bob.wiggle{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-6px)}}
.bob.chew{animation:chew .38s ease-in-out infinite}
@keyframes chew{0%,100%{transform:scale(1,1)}50%{transform:scale(1.045,.95)}}
.bob.hop{animation:hop .7s ease-out 1}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-34px) scale(.97,1.04)}60%{transform:translateY(0) scale(1.06,.94)}100%{transform:translateY(0) scale(1,1)}}
.burst{position:absolute; left:50%; top:46%; width:0; height:0; pointer-events:none}
.burst span{position:absolute; left:0; top:0; font-size:20px; animation:fly 1.1s ease-out forwards; text-shadow:0 0 6px rgba(246,215,122,.9)}
@keyframes fly{0%{transform:translate(0,0) scale(.3); opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.1) rotate(var(--r)); opacity:0}}
.panel{position:relative; margin-top:8px; background:rgba(255,255,255,.86); border:1.5px solid var(--line); border-radius:24px; padding:20px 18px 18px; box-shadow:0 10px 30px rgba(143,107,181,.14); text-align:center; overflow:hidden}
.panel h1{font-family:var(--head); font-weight:400; font-size:26px; line-height:1.25; margin:0 0 8px; color:var(--ink)}
.panel p{margin:0; line-height:1.6; font-size:16.5px; color:var(--muted)}
.btn{display:block; width:100%; border:0; border-radius:18px; padding:16px 14px; margin-top:16px; font-family:var(--head); font-size:20px; color:#fff; background:linear-gradient(180deg,#C6A3E3,var(--lav-d)); box-shadow:0 6px 0 #7452A0,0 12px 20px rgba(143,107,181,.3); cursor:pointer; transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(4px); box-shadow:0 2px 0 #7452A0}
.btn.ghost{background:#fff; color:var(--lav-d); box-shadow:0 0 0 2px var(--line); margin-top:10px; font-size:18px}
.btn.ghost:active{transform:none; background:var(--lav-soft)}
.btn[disabled]{opacity:.6}
.reading{font-family:var(--head); font-size:22px; color:var(--lav-d); padding:18px 0 6px}
.dots::after{content:'...'; animation:dots 1.2s steps(4) infinite; display:inline-block; width:1.2em; text-align:left; overflow:hidden; vertical-align:bottom}
@keyframes dots{0%{width:0}100%{width:1.2em}}
.gloom{position:relative; background:linear-gradient(180deg,#8F83A3,#6E6382); color:#fff; border-radius:20px; padding:16px; margin:2px 0 4px}
.gloom small{display:block; opacity:.8; font-size:13.5px; margin-bottom:4px}
.gloom b{font-family:var(--head); font-weight:400; font-size:20px; line-height:1.4}
.gloom.eaten{animation:eaten .9s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes eaten{0%{transform:translateY(0) scale(1); opacity:1}100%{transform:translateY(-230px) scale(.08); opacity:0}}
.stars{font-size:30px; letter-spacing:4px; color:var(--gold); text-shadow:0 2px 0 #E5BE55; margin-bottom:2px}
.stars s{text-decoration:none; color:#E6DAF0; text-shadow:none}
.date{font-size:14.5px; color:var(--muted); margin-bottom:6px}
.tag{display:inline-block; background:var(--lav-soft); color:var(--lav-d); border-radius:999px; padding:4px 12px; font-size:13.5px; margin-bottom:8px}
.line{color:var(--ink)!important; font-size:17.5px!important}
.tip{margin-top:12px; background:var(--cream); border:1.5px dashed #EBD9A8; border-radius:16px; padding:11px 12px; text-align:left; font-size:15.5px; line-height:1.5; color:#7A6840}
.tip b{font-family:var(--head); font-weight:400; color:#B08A2E}
.lucky{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
.lucky div{background:var(--lav-soft); border-radius:14px; padding:9px 8px; font-size:15px}
.lucky div span{display:block; font-size:12.5px; color:var(--muted); margin-bottom:1px}
.lucky div b{font-family:var(--head); font-weight:400; font-size:17px; color:var(--lav-d)}
.note{margin-top:18px; font-size:13.5px; color:var(--muted)}
footer{margin-top:auto; padding-top:18px; text-align:center; font-size:12.5px; color:#A99BBB}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#4A3A5C; color:#fff; padding:10px 16px; border-radius:14px; font-size:14.5px; z-index:9; opacity:0; transition:opacity .2s; pointer-events:none; max-width:86vw; text-align:center}
.toast.on{opacity:1}

.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0 4px}
.chip{border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:9px 14px; font:inherit; font-size:15.5px; cursor:pointer}
.chip[aria-pressed=true]{background:var(--lav); border-color:var(--lav); color:#fff}
.inp{width:100%; margin-top:12px; border:1.5px solid var(--line); border-radius:16px; padding:13px 14px; font:inherit; font-size:16px; color:var(--ink); background:#fff; outline:none}
.inp:focus{border-color:var(--lav)}
.eaten-n{margin-top:12px; font-size:14px; color:var(--lav-d)}
.care{background:#FFF4F6; border:1.5px solid #F7D3DB; border-radius:18px; padding:14px; text-align:left; line-height:1.6; font-size:16px; color:#7A4A58}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media (max-height:700px){.stage{height:290px}.bob{height:240px}#p-idle{width:228px}#p-eat{width:230px}#p-luck{width:270px}}
</style>
</head>

  $('snd').addEventListener('click',function(){ muted=!muted; try{localStorage.setItem('worrydoll-mute',muted?'1':'0')}catch(e){} syncSnd(); if(!muted){ac(); tone(880,0,.2,'sine',.1)} });
  syncSnd();

  /* ---------- 화면 ---------- */
  var bob=$('bob'), panel=$('panel'), busy=false, pick=-1;
  function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function setPose(n){ ['idle','eat','luck'].forEach(function(k){ $('p-'+k).classList.toggle('on',k===n) }) }
  function setAnim(c){ bob.className='bob'+(c?' '+c:'') }
  function burst(){
    var b=$('burst'); b.innerHTML=''; var ch=['✦','✧','♥','★'], cl=['#F6D77A','#F7B6C6','#B792D6','#fff'];
    for(var i=0;i<16;i++){ var s=document.createElement('span'), a=Math.PI*2*i/16+Math.random()*.4, d=90+Math.random()*90; s.textContent=ch[i%ch.length]; s.style.color=cl[i%cl.length]; s.style.setProperty('--x',Math.cos(a)*d+'px'); s.style.setProperty('--y',(Math.sin(a)*d-20)+'px'); s.style.setProperty('--r',(Math.random()*120-60)+'deg'); b.appendChild(s) }
    setTimeout(function(){b.innerHTML=''},1300);
  }
  function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('on')},2200) }
  function stars(n){ var s=''; for(var i=1;i<=5;i++) s+=(i<=n?'★':'<s>★</s>'); return '<div class="stars" aria-label="풀릴 기운 '+n+'점">'+s+'</div>' }

  function home(){
    busy=false; setPose('idle'); setAnim(''); pick=-1;
    var n=getN(), chips=CATS.map(function(c,i){return '<button type="button" class="chip" data-i="'+i+'" aria-pressed="false">'+c.n+'</button>'}).join('');
    panel.innerHTML='<h1>지금 어떤 걱정이<br>생겼어요?</h1><p>걱정을 인형에게 주면 대신 먹어주고,<br>풀릴 기운을 알려줘요.</p>'
      +'<div class="chips" id="chips">'+chips+'</div>'
      +'<input class="inp" id="wtxt" type="text" maxlength="40" placeholder="한 줄로 적어도 좋고, 안 적어도 돼요" autocomplete="off">'
      +'<button class="btn" id="go" type="button">걱정 먹여주기</button>'
      +(n?'<div class="eaten-n">지금까지 인형이 먹은 걱정 '+n+'개</div>':'');
    $('chips').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(!b) return; pick=+b.getAttribute('data-i'); [].forEach.call(document.querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed',String(x===b))}) });
    $('go').addEventListener('click',start);
  }

  function care(){
    setPose('idle'); setAnim('');
    panel.innerHTML='<h1>마음이 많이 힘들었구나</h1><div class="care">혼자 감당하기 힘든 마음이라면, 지금 바로 누군가와 이야기해도 괜찮아요.<br><b>109</b> 자살예방 상담전화(24시간)에서 이야기를 들어줄 수 있어요. 가까운 사람에게 먼저 연락해도 좋아요.</div>'
      +'<button class="btn ghost" id="back" type="button">돌아가기</button>';
    $('back').addEventListener('click',home);
  }

  function start(){
    if(busy) return;
    var text=($('wtxt').value||'').trim();
    if(DANGER.test(text)){ care(); return }
    busy=true; ac();
    var ci=pick<0?CATS.length-1:pick, C=CATS[ci];
    panel.innerHTML='<div class="reading">걱정을 인형에게 건네는 중<span class="dots"></span></div>';
    setAnim('wiggle'); sShake();
    setTimeout(function(){ eat(ci,text) },1200);
  }

  function eat(ci,text){
    var C=CATS[ci];
    panel.innerHTML='<div class="gloom" id="gl"><small>☁ '+esc(C.n)+' 걱정</small><b>'+(text?esc(text):'마음에 걸리는 일이 있어요')+'</b></div><p>인형이 걱정을 발견했어요!</p>';
    setAnim('');
    setTimeout(function(){
      setPose('eat'); setAnim('chew'); sMunch();
      $('gl').classList.add('eaten');
      panel.lastChild.textContent='냠냠… 걱정은 인형이 먹었어요';
    },1100);
    setTimeout(function(){ addN(); result(ci) },3200);
  }

  var last=null;
  function result(ci){
    var C=CATS[ci], sc=3+ri(3), o={ci:ci,score:sc,v:C.v[ri(C.v.length)],t:C.t[ri(C.t.length)],when:WHEN[ri(WHEN.length)],word:WORDS[ri(WORDS.length)]};
    last=o; setPose('luck'); setAnim('hop'); burst(); sChime();
    panel.innerHTML='<div class="date">'+dateText()+' · '+esc(C.n)+' 걱정</div>'
      +stars(sc)+'<h1>'+HEADS[sc]+'</h1><p class="line">'+o.v+'</p>'
      +'<div class="tip"><b>기다리는 동안 해볼 한 가지</b><br>'+o.t+'</div>'
      +'<div class="lucky"><div><span>가벼워지는 때</span><b>'+o.when+'</b></div><div><span>행운의 한마디</span><b>'+o.word+'</b></div></div>'
      +'<button class="btn" id="sv" type="button">카드 저장하기</button>'
      +(navigator.share?'<button class="btn ghost" id="sh" type="button">친구에게 공유하기</button>':'')
      +'<button class="btn ghost" id="again" type="button">다른 걱정 먹여주기</button>'
      +'<p class="note">재미로 보는 위로예요. 같은 걱정이 계속 무겁다면 주변 사람이나 전문가와 이야기해보세요.</p>';
    $('sv').addEventListener('click',function(){ saveCard(o,false) });
    if($('sh')) $('sh').addEventListener('click',function(){ saveCard(o,true) });
    $('again').addEventListener('click',home);
    busy=false;
  }

  /* ---------- 카드 이미지 ---------- */
  function img(src){return new Promise(function(res,rej){var i=new Image(); i.onload=function(){res(i)}; i.onerror=rej; i.src=src})}
  function wrapText(c,t,w){var out=[],cur='';for(var i=0;i<t.length;i++){var n=cur+t[i]; if(c.measureText(n).width>w&&cur){out.push(cur);cur=t[i].trim()?t[i]:''}else cur=n} if(cur)out.push(cur); return out}
  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  function makeCard(o){
    var C=CATS[o.ci], HF="'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif", BF="'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    var loads=[]; try{ loads=[document.fonts.load('40px Jua','가나다'),document.fonts.load('30px "Gowun Dodum"','가나다')] }catch(e){}
    return Promise.all(loads.map(function(p){return p.catch(function(){})})).then(function(){return img(DOLL.luck)}).then(function(doll){
      var W=1080,H=1920,cv=document.createElement('canvas'); cv.width=W; cv.height=H; var c=cv.getContext('2d');
      var g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#F1E6FA'); g.addColorStop(1,'#FFEEF2'); c.fillStyle=g; c.fillRect(0,0,W,H);
      c.fillStyle='rgba(255,255,255,.75)'; for(var i=0;i<26;i++){var sx=(i*379)%W, sy=(i*613)%H, sr=3+(i%4)*2; c.beginPath(); c.arc(sx,sy,sr,0,7); c.fill()}
      c.textAlign='center'; c.textBaseline='alphabetic';
      c.fillStyle='#8F6BB5'; c.font='64px '+HF; c.fillText('☾ 걱정인형',W/2,150);
      c.fillStyle='#8A7B9C'; c.font='42px '+BF; c.fillText(dateText()+' · '+C.n+' 걱정',W/2,222);
      var rg=c.createRadialGradient(W/2,610,40,W/2,610,430); rg.addColorStop(0,'rgba(255,255,255,.95)'); rg.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=rg; c.fillRect(0,170,W,880);
      var dw=760, dh=dw*doll.height/doll.width; c.drawImage(doll,(W-dw)/2,330,dw,dh);
      var y=330+dh+90;
      c.font='96px '+HF; c.fillStyle='#F6D77A'; var st=''; for(var k=1;k<=5;k++) st+=(k<=o.score?'★':'☆'); c.fillText(st,W/2,y);
      y+=110; c.fillStyle='#4A3A5C'; c.font='70px '+HF;
      wrapText(c,HEADS[o.score],W-200).forEach(function(l){c.fillText(l,W/2,y); y+=90});
      y+=14; c.fillStyle='#6B5B7C'; c.font='46px '+BF;
      wrapText(c,o.v,W-220).forEach(function(l){c.fillText(l,W/2,y); y+=68});
      y+=24; rr(c,100,y,W-200,118,34); c.fillStyle='#FFFAF2'; c.fill(); c.setLineDash([14,10]); c.strokeStyle='#EBD9A8'; c.lineWidth=4; c.stroke(); c.setLineDash([]);
      c.fillStyle='#B08A2E'; c.font='34px '+HF; c.fillText('기다리는 동안 해볼 한 가지',W/2,y+44); c.fillStyle='#7A6840'; c.font='36px '+BF; c.fillText(o.t,W/2,y+92);
      y+=118+50;
      var L=[['가벼워지는 때',o.when],['행운의 한마디',o.word]], bw=(W-200-30)/2;
      L.forEach(function(it,i){var bx=100+i*(bw+30); rr(c,bx,y,bw,118,28); c.fillStyle='rgba(255,255,255,.9)'; c.fill(); c.fillStyle='#8A7B9C'; c.font='30px '+BF; c.fillText(it[0],bx+bw/2,y+42); c.fillStyle='#8F6BB5'; c.font=(it[1].length>9?'32px ':'40px ')+HF; c.fillText(it[1],bx+bw/2,y+92)});
      c.fillStyle='#A99BBB'; c.font='32px '+BF; c.fillText('걱정인형 · 걱정은 먹고, 기운은 채우고',W/2,H-70);
      return cv;
    });
  }
  function saveCard(o,share){
    toast('카드를 만드는 중이에요');
    makeCard(o).then(function(cv){
      cv.toBlob(function(blob){
        if(!blob){toast('카드를 만들지 못했어요'); return}
        var name='걱정인형-카드.png';
        if(share&&navigator.canShare){ try{ var f=new File([blob],name,{type:'image/png'}); if(navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'걱정인형',text:'걱정을 인형이 먹어줬어요'}).catch(function(){}); return } }catch(e){} }
        if(share&&navigator.share){ navigator.share({title:'걱정인형',text:'걱정을 인형이 먹어줬어요',url:location.href.split('?')[0]}).catch(function(){}); return }
        var url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url)},4000);
        toast('저장했어요. 안 보이면 다운로드 폴더를 확인해보세요');
      },'image/png');
    }).catch(function(){toast('카드를 만들지 못했어요')});
  }

  /* ---------- 하늘 장식 ---------- */
  (function(){var sky=$('sky'), n=26; for(var i=0;i<n;i++){var s=document.createElement('i'); s.textContent=i%3?'✦':'✧'; s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%'; s.style.fontSize=(8+Math.random()*12)+'px'; s.style.animationDelay=(Math.random()*4)+'s'; s.style.animationDuration=(3+Math.random()*3)+'s'; sky.appendChild(s)}})();

  window.__w={home:home,start:start,eat:eat,result:result,pick:function(i){pick=i}};
  home();
})();
</script>
</body>
</html>
